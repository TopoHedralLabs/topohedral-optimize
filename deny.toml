[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    # `topohedral-linalg` currently uses the previous tracing generation.
    { name = "topohedral-tracing", version = "=0.1.1" },
    { name = "topohedral-tracing-macros", version = "=0.0.0" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://cargo.cloudsmith.io/topohedrallabs/topohedral/",
]
